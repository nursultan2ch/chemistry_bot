services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chemistry_bot
      POSTGRES_USER: chemistry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemistry -d chemistry_bot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chemistry:${POSTGRES_PASSWORD}@db/chemistry_bot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 admin:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chemistry:${POSTGRES_PASSWORD}@db/chemistry_bot
    # Bound to localhost only: reach it through an SSH tunnel or a reverse proxy with HTTPS
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
